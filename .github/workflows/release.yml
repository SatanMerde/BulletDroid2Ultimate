name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        working-directory: bullet_droid
        run: flutter pub get

      - name: Run code generation
        working-directory: bullet_droid
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: bullet_droid
        run: flutter build apk --release

      - name: Rename APK
        run: mv bullet_droid/build/app/outputs/flutter-apk/app-release.apk bullet_droid/build/app/outputs/flutter-apk/BulletDroid2Ultimate.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bullet_droid/build/app/outputs/flutter-apk/BulletDroid2Ultimate.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
